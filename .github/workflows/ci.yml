name: ci
on:
  push:
  pull_request:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # flxk1/loomground is private: cloning needs LOOMGROUND_READ_TOKEN (a
      # fine-grained PAT with contents:read on that repo) in this repo's
      # secrets. If the standard ever goes public, the anonymous fallback
      # works and the secret can be deleted.
      - name: clone the Loomground standard
        run: |
          if [ -n "${{ secrets.LOOMGROUND_READ_TOKEN }}" ]; then
            git clone --depth 1 "https://x-access-token:${{ secrets.LOOMGROUND_READ_TOKEN }}@github.com/flxk1/loomground.git" /tmp/loomground
          else
            git clone --depth 1 https://github.com/flxk1/loomground.git /tmp/loomground
          fi
      - name: reproduce every conformance vector
        run: LOOMGROUND_ROOT=/tmp/loomground python3 verify.py
      - name: machine-readable layer cross-checks
        run: LOOMGROUND_ROOT=/tmp/loomground python3 test_machine_readable.py

  commit-discipline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: commit discipline (new commits only)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch -q origin ${{ github.base_ref }}
            range="origin/${{ github.base_ref }}..HEAD"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            range="${{ github.event.before }}..${{ github.sha }}"
          else
            range="${{ github.sha }} -1"
          fi
          bad=0
          git log --no-merges --format='%s' $range | awk 'length($0)>72 {print "subject >72 chars: " $0; bad=1} END {exit bad}' || bad=1
          if git log --no-merges --format='%(trailers)' $range | grep -iE '^Co-Authored-By:.*(claude|codex|openai|anthropic|copilot|gemini)'; then
            echo "AI co-author trailer found — use the assisted line instead (CLAUDE.md)"; bad=1
          fi
          exit $bad
