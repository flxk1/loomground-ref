name: ci
on:
  push:
  pull_request:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: install test dependencies
        run: python3 -m pip install --quiet jsonschema
      # The standard is flxk1/loomground-governance; its machine-readable bundle
      # (spec, grammar, schema, conformance, vocabulary) lives under standard/.
      # The anonymous clone works while it is public; the LOOMGROUND_READ_TOKEN
      # fallback (a fine-grained PAT with contents:read) covers it going private.
      - name: clone the Loomground standard
        run: |
          if [ -n "${{ secrets.LOOMGROUND_READ_TOKEN }}" ]; then
            git clone --depth 1 "https://x-access-token:${{ secrets.LOOMGROUND_READ_TOKEN }}@github.com/flxk1/loomground-governance.git" /tmp/loomground-governance
          else
            git clone --depth 1 https://github.com/flxk1/loomground-governance.git /tmp/loomground-governance
          fi
      - name: reproduce every conformance vector
        run: LOOMGROUND_ROOT=/tmp/loomground-governance/standard python3 tools/verify.py
      - name: machine-readable layer cross-checks
        run: LOOMGROUND_ROOT=/tmp/loomground-governance/standard python3 tests/test_machine_readable.py

  commit-discipline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: commit discipline (new commits only)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch -q origin ${{ github.base_ref }}
            range="origin/${{ github.base_ref }}..HEAD"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            range="${{ github.event.before }}..${{ github.sha }}"
          else
            range="${{ github.sha }} -1"
          fi
          bad=0
          git log --no-merges --format='%s' $range | awk 'length($0)>72 {print "subject >72 chars: " $0; bad=1} END {exit bad}' || bad=1
          if git log --no-merges --format='%(trailers)' $range | grep -iE '^Co-Authored-By:.*(claude|codex|openai|anthropic|copilot|gemini)'; then
            echo "AI co-author trailer found — use the assisted line instead (CLAUDE.md)"; bad=1
          fi
          exit $bad
